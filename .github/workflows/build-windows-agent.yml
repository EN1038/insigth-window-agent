name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "go-agent/**"
      - ".github/workflows/build-windows-agent.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build insite-agent.exe
        run: |
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o ../dist/insite-agent.exe ./cmd/insite-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: insite-agent-windows
          path: dist/insite-agent.exe
          if-no-files-found: error
